name: "✨ Feature Request"
description: Suggest a new feature or improvement for kururu
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        **Someone may have asked already.** Check the
        [roadmap](https://github.com/PathGao/kururu/blob/main/ROADMAP.md) and
        [existing issues](https://github.com/PathGao/kururu/issues) before
        proposing a new direction. Add relevant details to an existing request
        when it describes the same problem.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: It would be great if kururu could...
    validations:
      required: true

  - type: dropdown
    id: feature_area
    attributes:
      label: Feature Area
      description: The same groups you see in Settings.
      options:
        - Windows and Dock
        - Mouse and keyboard
        - Clipboard and files
        - Sound
        - Energy and display
        - Tools
        - System monitor
        - Menu bar
        - Other
    validations:
      required: true

  - type: input
    id: existing_apps
    attributes:
      label: Does another app already do this?
      description: "Name a relevant app or platform feature and describe the specific behavior you mean. The roadmap records current scope and historical references."
      placeholder: "Rectangle, Raycast, macOS itself..."

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: Attach sketches, screenshots, or references.
